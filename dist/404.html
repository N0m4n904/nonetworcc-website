<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not here — Noah Anleitner</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <style>
      /* Its own page rather than the app: a 404 that boots a whole framework to
         say four words is a poor trade, and this one has to work when the thing
         being asked for does not exist. The colours and the face are the
         page's, copied deliberately — it is twenty lines, not a design system. */

      /* No @font-face here on purpose. The site's handwriting is bundled under
         a hashed name that changes with every build, and copying an 80kB file
         into public/ for a page nobody should reach is a poor trade. The
         fallback stack the site already names is handwriting anyway. */

      :root {
        --ground: #f7f6fb;
        --ink: #14121c;
        --ink-soft: #4b4661;
        --violet: #7209c0;
        --cyan: #0479a3;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #0b0a12;
          --ink: #f4f2fb;
          --ink-soft: #b6b1c9;
          --violet: #b06bff;
          --cyan: #4bd8ff;
        }
      }

      * { box-sizing: border-box; margin: 0; }

      body {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 1.25rem;
        padding: clamp(1.5rem, 6vw, 5rem);
        background: var(--ground);
        color: var(--ink);
        /* The site's handwriting is not loaded here (see above), and "cursive"
           resolves to a serif on machines without Comic Sans. A plain system
           sans is a better neighbour to the gradient than a random serif. */
        font-family: 'Comic Sans MS', system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.7;
      }

      h1 {
        font-size: clamp(3rem, 1rem + 9vw, 7rem);
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: -0.02em;
        background-image: linear-gradient(100deg, var(--violet), var(--cyan));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p { color: var(--ink-soft); max-width: 34rem; font-size: clamp(1rem, 0.96rem + 0.2vw, 1.125rem); }

      a.home {
        display: inline-flex;
        padding: 0.6rem 1.4rem;
        border-radius: 999px;
        background-image: linear-gradient(100deg, #8c0be8, #00c6ff);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }

      /* The page's own line, drawn once and not moving. */
      svg { width: clamp(8rem, 18vw, 14rem); height: 14px; overflow: visible; }
      svg path { fill: none; stroke: url(#g); stroke-width: 4; stroke-linecap: round; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 200 14" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8c0be8" />
          <stop offset="1" stop-color="#00c6ff" />
        </linearGradient>
      </defs>
      <path d="M2 9c28-6 52 2 78-1s52-7 118-2" />
    </svg>

    <h1>Nothing here</h1>
    <p>
      That address does not lead anywhere on this site — it may have been mistyped,
      or it may never have existed. Nichts gefunden: diese Adresse führt hier nirgendwohin.
    </p>
    <a class="home" href="/">Back to the start</a>
  </body>
</html>
