<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nothing here — Noah Anleitner</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />

    <!-- The same pointer the site draws, from the same URL and the same
         version, so anyone arriving here from the site has it cached already
         and this costs them nothing. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/N0m4n904/smartcursor@v1.4.0/smartcursor.css"
          integrity="sha384-DJ28qhylHcyHeG8xQ+6dpdA7kmM/WA6RYJDSMoATHaPbTUWBbFuR2m8NJsrh+GiL" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/gh/N0m4n904/smartcursor@v1.4.0/smartcursor.js"
            integrity="sha384-10cf4kvCVDBb2inFJcb2OHHVqejWTZZLCXDeeA9pgIwYD6Pglz/Cn31yUu0BRdOP" crossorigin="anonymous" defer></script>
    <style>
      /* Its own page rather than the app: a 404 that boots a whole framework to
         say four words is a poor trade, and this one has to work when the thing
         being asked for does not exist. The colours are the site's, copied
         deliberately — it is thirty lines, not a design system. */

      /* The pointer's own tokens, as the site sets them: the dot in the two
         ends of the gradient, and a ring drawn rather than bordered. */
      :root {
        --brand: #8c0be8;
        --brand-light: #00c6ff;
        --sc-sketch: 1;
        --sc-sketch-wiggle: 2.4px;
        --sc-ring-width: 2.6px;
        --sc-ease: 0.45;
      }

      :root {
        --ground: #f7f6fb;
        --ink: #14121c;
        --ink-soft: #4b4661;
        --violet: #7209c0;
        --cyan: #0479a3;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #0b0a12;
          --ink: #f4f2fb;
          --ink-soft: #b6b1c9;
          --violet: #b06bff;
          --cyan: #4bd8ff;
        }
      }

      * { box-sizing: border-box; margin: 0; }

      body {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 1.25rem;
        padding: clamp(1.5rem, 6vw, 5rem);
        background: var(--ground);
        color: var(--ink);
        /* The site's handwriting is not loaded here: it is bundled under a
           hashed name that changes with every build, and copying an 80kB file
           for a page nobody should reach is a poor trade. On the site proper
           the fallbacks are a stopgap seen for a moment while it arrives; here
           there is nothing to fall back from, so whatever is named first is
           simply the typeface. Carlito follows Calibri because it is
           metric-compatible and is the one a Linux machine is likely to have. */
        font-family: Calibri, Carlito, system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.7;
      }

      h1 {
        font-size: clamp(3rem, 1rem + 9vw, 7rem);
        font-weight: 700;
        /* Room for the tail of the g. The gradient is clipped to the text box,
           and a line-height below one leaves a descender outside it — where it
           is simply not painted. */
        line-height: 1.15;
        padding-block-end: 0.08em;
        letter-spacing: -0.02em;
        background-image: linear-gradient(100deg, var(--violet), var(--cyan));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        color: var(--ink-soft);
        max-width: 34rem;
        font-size: clamp(1rem, 0.96rem + 0.2vw, 1.125rem);
      }

      a.home {
        display: inline-flex;
        padding: 0.6rem 1.4rem;
        border-radius: 999px;
        background-image: linear-gradient(100deg, #8c0be8, #00c6ff);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }

      svg { width: clamp(8rem, 18vw, 14rem); height: 14px; overflow: visible; }
      svg path { fill: none; stroke: url(#g); stroke-width: 4; stroke-linecap: round; }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 200 14" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8c0be8" />
          <stop offset="1" stop-color="#00c6ff" />
        </linearGradient>
      </defs>
      <path d="M2 9c28-6 52 2 78-1s52-7 118-2" />
    </svg>

    <!-- English is what the page is written in, so a visitor without
         JavaScript reads something sensible rather than nothing. The German is
         carried alongside and swapped in below, by the rule the site uses. -->
    <h1 data-de="Nichts gefunden">Nothing here</h1>
    <p data-de="Diese Adresse führt hier nirgendwohin – vielleicht ein Tippfehler, vielleicht hat es sie nie gegeben.">
      That address does not lead anywhere on this site — it may have been mistyped,
      or it may never have existed.
    </p>
    <a class="home" href="/" data-de="Zurück zum Anfang">Back to the start</a>

    <script>
      // smartcursor is deferred, so it has run by the time this fires. It
      // ships off by default and refuses to start where there is no pointer,
      // so there is nothing to check beyond its being there at all. The one
      // link on the page is already in its built-in list of things to hug.
      document.addEventListener("DOMContentLoaded", function () {
        if (window.smartCursor) window.smartCursor.setEnabled(true);
      });

      // The same rule as the site: German for a browser asking for German,
      // English for every other. The first entry of the list decides, so
      // somebody who merely has German further down it does not get German.
      (function () {
        var first = (navigator.languages && navigator.languages[0]) || navigator.language || "";
        if (!/^de\b/i.test(first)) return;
        document.documentElement.lang = "de";
        document.title = "Nichts gefunden — Noah Anleitner";
        document.querySelectorAll("[data-de]").forEach(function (el) {
          el.textContent = el.getAttribute("data-de");
        });
      })();
    </script>
  </body>
</html>
