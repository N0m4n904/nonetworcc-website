<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- The handwriting is found only once the stylesheet has been read, so on
         a first visit the page shows the fallback face for a moment and then
         snaps. Naming it here starts that download with everything else. Only
         the latin cut is named: it has the German umlauts too, and no visitor
         waits for the 37 kB of latin-ext. -->
    <link rel="preload" href="/assets/shantell-sans-latin-B8jqu5lV.woff2" as="font" type="font/woff2" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/N0m4n904/smartcursor@v1.6.1/smartcursor.css"
          integrity="sha384-THQMu0w8WqSccJ9MIKnd9SW0dGoYFR58Fewgq/iBTI7kQ9aIFmcO0UA59x4n3139" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/gh/N0m4n904/smartcursor@v1.6.1/smartcursor.js"
            integrity="sha384-W9EJW0w2Hgn1cFlMLmEaiJPU39Lgn1Xc3PVrckWhVUhURilmecm2HxTuNZZM+eK3" crossorigin="anonymous" defer></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noah Anleitner</title>
    <!-- The mark of the site in the accent of the palette. It is drawn at
         16-32px, and PNG because WebP is the one place a favicon still cannot
         be trusted. -->
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <meta name="description" content="Software developer. Projects, work and a car." />

    <!-- The title and the description a service reads when a link to this site
         is shared. There is no picture for it.

         These are read by crawlers, which do not run the language detection, so
         they stay in English whatever the visitor's browser is set to. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nonetwor.cc/" />
    <meta property="og:site_name" content="Noah Anleitner" />
    <meta property="og:title" content="Noah Anleitner — Software developer" />
    <meta property="og:description" content="Software development for a living and for the fun of it, and tuning my car when I am not coding." />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="de_DE" />

    <link rel="canonical" href="https://nonetwor.cc/" />

    <!-- Who this is, in the form a search engine can read rather than infer.
         Only what the page already says out loud. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Noah Anleitner",
        "url": "https://nonetwor.cc/",
        "jobTitle": "Software developer",
        "email": "mailto:contact@nonetwor.cc",
        "nationality": "DE",
        "address": { "@type": "PostalAddress", "addressCountry": "DE" },
        "sameAs": [
          "https://github.com/N0m4n904",
          "https://gitlab.com/N0m4n904",
          "https://www.instagram.com/b9_allroad_kru/"
        ]
      }
    </script>
    <style>
      /* Kept here rather than in the stylesheet because it configures the two
         tags above it: these are the cursor's own tokens, not the page's. */

      /* The pointer's colours are the site's and are set with the rest of them
         in public/palette.css; what is left here is its shape. */
      :root {
        /* The ring is drawn by hand, like every other line in the book. */
        --sc-sketch: 1;
        --sc-sketch-wiggle: 2.4px;
        --sc-ring-width: 2.6px;
        /* The ring closes on its target faster than the default, so the
           outline arrives together with the pointer. */
        --sc-ease: 0.45;
      }

      /* No rule here sets the layer of the ring. Since v1.5.0 it is drawn at
         the height of the element it is around. */
    </style>
    <script type="module" crossorigin src="/assets/index-BUwetDHK.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-nirKn2uk.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
