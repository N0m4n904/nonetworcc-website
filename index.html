<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/N0m4n904/smartcursor@v1.4.0/smartcursor.css"
          integrity="sha384-DJ28qhylHcyHeG8xQ+6dpdA7kmM/WA6RYJDSMoATHaPbTUWBbFuR2m8NJsrh+GiL" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/gh/N0m4n904/smartcursor@v1.4.0/smartcursor.js"
            integrity="sha384-10cf4kvCVDBb2inFJcb2OHHVqejWTZZLCXDeeA9pgIwYD6Pglz/Cn31yUu0BRdOP" crossorigin="anonymous" defer></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noah Anleitner</title>
    <!-- A favicon is drawn at 16-32px; it was being handed a 1024px, 1.4MB
         file. WebP is the one place a favicon still cannot be trusted, so this
         stays PNG — just a sanely sized one. -->
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <meta name="description" content="Software developer. Projects, work and a car." />
    <style>
      /* Kept here rather than in the stylesheet because it configures the two
         tags above it: these are the cursor's own tokens, not the page's. */

      /* Smart cursor dot, in the two ends of the site gradient. Named for the
         surface each is drawn on, so this holds for light and dark alike. */
      :root {
        --brand: #8c0be8;
        --brand-light: #00c6ff;
        /* The pointer's ring is generated the same way the outlines are: a
           seeded wobble pushed off each edge, not anything drawn by a person. */
        --sc-sketch: 1;
        --sc-sketch-wiggle: 2.4px;
        --sc-ring-width: 2.6px;
        /* Closes on its target faster than the default, so the outline arrives
           with the pointer rather than catching up to it. */
        --sc-ease: 0.45;
      }

      /* The ring is left at the height smartcursor gives it, above everything
         including the bar. It was pushed under the bar once, on the reasoning
         that it hugs page content and so belongs where that content does — but
         it also hugs the links in the bar, and there it was hidden behind the
         very thing it was drawing around. */

      /* The mark is white line art, which needs reversing on a light ground. */
      @media (prefers-color-scheme: light) {
        .hero__logo {
          filter: invert(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
