<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/N0m4n904/smartcursor@v1.6.0/smartcursor.css"
          integrity="sha384-ure51TiRpN+5RSDObvTYQdOPenAnTO1x8dMGHv9U6c2YtLaHVu+udg53Eh18rcRz" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/gh/N0m4n904/smartcursor@v1.6.0/smartcursor.js"
            integrity="sha384-l0F2/cjZRHQmQJZ4+ejeBMTCZshwMjQqM3sffCsFCk8PJVk++1gi7HiquFWWtekI" crossorigin="anonymous" defer></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noah Anleitner</title>
    <!-- A favicon is drawn at 16-32px; it was being handed a 1024px, 1.4MB
         file. WebP is the one place a favicon still cannot be trusted, so this
         stays PNG — just a sanely sized one. -->
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <meta name="description" content="Software developer. Projects, work and a car." />

    <!-- What a link to this site turns into when it is shared. Without these it
         arrives as a bare URL. The card is drawn from the page's own parts by
         `npm run og`, so it cannot drift into a separate design.

         These are read by crawlers, which do not run the language detection, so
         they stay in English whatever the visitor's browser is set to. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nonetwor.cc/" />
    <meta property="og:site_name" content="Noah Anleitner" />
    <meta property="og:title" content="Noah Anleitner — Software developer" />
    <meta property="og:description" content="Software development for a living and for the fun of it, and tuning my car when I am not coding." />
    <meta property="og:image" content="https://nonetwor.cc/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Noah Anleitner, software developer" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="de_DE" />

    <link rel="canonical" href="https://nonetwor.cc/" />

    <!-- Who this is, in the form a search engine can read rather than infer.
         Only what the page already says out loud. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Noah Anleitner",
        "url": "https://nonetwor.cc/",
        "image": "https://nonetwor.cc/og.png",
        "jobTitle": "Software developer",
        "email": "mailto:contact@nonetwor.cc",
        "nationality": "DE",
        "address": { "@type": "PostalAddress", "addressCountry": "DE" },
        "sameAs": [
          "https://github.com/N0m4n904",
          "https://gitlab.com/N0m4n904",
          "https://www.instagram.com/b9_allroad_kru/"
        ]
      }
    </script>
    <style>
      /* Kept here rather than in the stylesheet because it configures the two
         tags above it: these are the cursor's own tokens, not the page's. */

      /* The pointer's colours are the site's and are set with the rest of them
         in public/palette.css; what is left here is its shape. */
      :root {
        /* The pointer's ring is generated the same way the outlines are: a
           seeded wobble pushed off each edge, not anything drawn by a person. */
        --sc-sketch: 1;
        --sc-sketch-wiggle: 2.4px;
        --sc-ring-width: 2.6px;
        /* Closes on its target faster than the default, so the outline arrives
           with the pointer rather than catching up to it. */
        --sc-ease: 0.45;
      }

      /* Nothing here says where the ring is drawn. It was set under the bar
         once, on the reasoning that it hugs page content and so belongs where
         that content does — but it also hugs the links in the bar, and there it
         was hidden behind the very thing it was drawing around. Since v1.5.0 it
         takes the height of whatever it is hugging and neither answer has to be
         chosen here. */

      /* The mark is white line art, which needs reversing on a light ground. */
      @media (prefers-color-scheme: light) {
        .hero__logo {
          filter: invert(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
