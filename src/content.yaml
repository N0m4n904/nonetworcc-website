# Everything the page lists, in the order it lists it. Adding an entry here is
# meant to be the whole job — the page builds each section by walking these.
#
# A tile (work and projects both use the same shape):
#
# Any text field below may be either a plain string — the same in both
# languages, which is true of most names — or a map of language to string:
#
#     body:
#       en: A Discord bot in Kotlin for the halogenOS team.
#       de: Ein Discord-Bot in Kotlin für das halogenOS-Team.
#
# German is used when the browser asks for German; everything else gets the
# English. A missing German falls back to the English rather than vanishing.
#
#   title      required.
#   badge      optional. The pill beside the title, for things not public or
#              no longer maintained.
#   body       required. The sentence or two under the title.
#   note       optional. The quieter line under the body, for provenance and
#              caveats rather than description.
#   date       optional. The date since when I work on that project
#   media      optional. Leave it out and the tile drops the mark column and
#              runs full width, which is what tile--plain used to say.
#     src        path or URL of the mark.
#     alt        empty string for a mark that repeats the title; the title is
#                right there, and a screen reader does not need it twice.
#     treatment  one of: plate, past, rounded. Omit for a plain mark.
#                  plate    — white plate behind marks carrying their own
#                             opaque background, which would otherwise sit as
#                             a hard rectangle on the page.
#                  past     — colour drained, returning on hover. For work
#                             that is over.
#                  rounded  — squircle corners, for app icons already drawn
#                             to be masked.
#   links      optional. The row beneath.
#     text       what the link says.
#     href       where it goes.
#     icon       one of: github, gitlab, instagram. Omit for a bare link.
#                Must match a symbol id in index.html, minus the "icon-".
#
# Below the tiles come the two sections that are lists of something else: the
# garage's permalinks, and the tools at the end.
#
# A tool is a name and where that name goes:
#
#     - name: Kotlin
#       href: https://kotlinlang.org
#
# The href is optional — a bare string is a tool with nowhere to go, and is
# drawn as a pill that does not answer the pointer.

