        Touch-Oberfläche, auf Wunsch vorgelesen, mit Dashboard, Nachrichten, Wetter,
        Kalender, Dokumenten, Karten und Medien. Gebaut für Wohnheime für Menschen mit
        Behinderung, Seniorenheime, Tagesstätten und Schulen.
